name: CI

# Static checks for the build scripts. Cheap and fast; runs on every change.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck build.sh

      - name: Python
        run: python3 -m py_compile scripts/build-skia.py

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path build.ps1 -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $results | Format-Table -AutoSize Line, Severity, RuleName, Message | Out-String -Width 200
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: build.sh smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./build.sh --help >/dev/null
          ./build.sh --script-version
          ./build.sh --list
          if ./build.sh --bogus 2>/dev/null; then exit 1; fi
