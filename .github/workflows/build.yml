name: Build

# Compiles Aseprite for Windows, Linux and macOS (x64 and arm64) and uploads
# every package to a DRAFT release.
#
# Draft releases are only visible to accounts with write access to this
# repository. That keeps the binaries private, as required by the Aseprite
# EULA, which forbids distributing them to third parties. Do not publish the
# draft or make the binaries public.
#
# Nothing is stored in the Actions cache or as workflow artifacts: each job
# uploads its package straight to the release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Aseprite release to build (e.g. v1.3.18.6), or "latest"
        required: true
        default: latest
      targets:
        description: Comma-separated targets (windows-x64, windows-arm64, linux-x64, linux-arm64, macos-x64, macos-arm64), or "all"
        required: true
        default: all

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          REQUESTED: ${{ inputs.version || 'latest' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED" == "latest" ]]; then
            version="$(gh api "repos/aseprite/aseprite/releases/latest" --jq .tag_name)"
          else
            [[ "$REQUESTED" == v* ]] || REQUESTED="v$REQUESTED"
            version="$(gh api "repos/aseprite/aseprite/releases/tags/$REQUESTED" --jq .tag_name)" ||
              { echo "::error::Aseprite release $REQUESTED does not exist"; exit 1; }
          fi
          echo "Aseprite $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          publish=true
          if [[ "$EVENT" == "pull_request" ]]; then
            publish=false
          elif gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$EVENT" == "schedule" ]]; then
              echo "A release for $version already exists, nothing to do."
              publish=skip
            else
              echo "Replacing the existing release for $version"
              gh release delete "$version" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.resolve.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" -R "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" \
            --title "Aseprite $VERSION" \
            --notes "Build in progress: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Select targets
        id: matrix
        if: steps.resolve.outputs.publish != 'skip'
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        shell: python
        run: |
          import json, os, sys
          all_targets = [
              {"target": "windows-x64",   "os": "windows-2022",     "arch": "x64"},
              {"target": "windows-arm64", "os": "windows-11-arm",   "arch": "arm64"},
              {"target": "linux-x64",     "os": "ubuntu-22.04",     "arch": "x64"},
              {"target": "linux-arm64",   "os": "ubuntu-22.04-arm", "arch": "arm64"},
              {"target": "macos-x64",     "os": "macos-15-intel",   "arch": "x64"},
              {"target": "macos-arm64",   "os": "macos-26",         "arch": "arm64"},
          ]
          wanted = os.environ["TARGETS"].replace(" ", "")
          if wanted.lower() != "all":
              names = set(wanted.split(","))
              unknown = names - {t["target"] for t in all_targets}
              if unknown:
                  print(f"::error::Unknown targets: {', '.join(sorted(unknown))}")
                  sys.exit(1)
              all_targets = [t for t in all_targets if t["target"] in names]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": all_targets}) + "\n")

  build:
    name: ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.publish != 'skip'
    runs-on: ${{ matrix.os }}
    # Targets without a prebuilt Skia (linux-arm64, windows-arm64) compile it first
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./build.sh --yes --install-deps \
            --version "$VERSION" \
            --arch "${{ matrix.arch }}" \
            --work-dir "$RUNNER_TEMP/work" \
            --output "$RUNNER_TEMP/output"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build.bat -Yes -Version %VERSION% -Arch ${{ matrix.arch }} -WorkDir C:\w -OutputDir "%RUNNER_TEMP%\output"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/output/aseprite-$VERSION-${{ matrix.target }}"
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get install -y -qq xvfb >/dev/null
              file "$pkg/aseprite"
              xvfb-run -a "$pkg/aseprite" --batch --version
              ;;
            macOS)
              exe="$pkg/Aseprite.app/Contents/MacOS/aseprite"
              file "$exe"
              codesign --verify --verbose "$pkg/Aseprite.app"
              "$exe" --batch --version
              ;;
            Windows)
              exe="$(cygpath -w "$pkg/aseprite.exe")"
              powershell -NoProfile -Command "\$p = Start-Process -FilePath '$exe' -ArgumentList '--batch','--version' -Wait -PassThru -NoNewWindow; if (\$p.ExitCode -ne 0) { exit \$p.ExitCode }"
              ;;
          esac

      - name: Upload to release
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/output"
          shopt -s nullglob
          files=(aseprite-"$VERSION"-${{ matrix.target }}.{zip,tar.gz,dmg} aseprite-"$VERSION"-${{ matrix.target }}.*.sha256)
          [[ ${#files[@]} -gt 0 ]] || { echo "::error::no package found"; ls -la; exit 1; }
          ls -la "${files[@]}"
          for attempt in 1 2 3; do
            gh release upload "$VERSION" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}" && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep $((attempt * 10))
          done

  finalize:
    name: Finalize release
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Write release notes
        run: |
          set -euo pipefail
          assets="$(gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -qvE '\.sha256$' <<<"$assets"; then
            echo "::error::No target was built successfully; deleting the draft release"
            gh release delete "$VERSION" -R "$GITHUB_REPOSITORY" --yes || true
            exit 1
          fi

          row() {
            local target=$1 label=$2 file
            file="$(grep -E "^aseprite-$VERSION-$target\.(zip|tar\.gz|dmg)$" <<<"$assets" || true)"
            if [[ -n "$file" ]]; then
              echo "| $label | \`$file\` |"
            else
              echo "| $label | not available (build failed) |"
            fi
          }

          {
            echo "Aseprite [$VERSION](https://github.com/aseprite/aseprite/releases/tag/$VERSION), compiled from the official source code."
            echo
            echo "| Platform | Package |"
            echo "|---|---|"
            row windows-x64   "Windows x64"
            row windows-arm64 "Windows ARM64"
            row linux-x64     "Linux x64 (glibc 2.35+)"
            row linux-arm64   "Linux ARM64 (glibc 2.35+)"
            row macos-x64     "macOS Intel (10.15+)"
            row macos-arm64   "macOS Apple Silicon (11.0+)"
            echo
            echo "Each package has a matching \`.sha256\` file."
            echo
            echo "**Personal use only.** These builds are covered by the Aseprite EULA,"
            echo "which forbids distributing them to third parties. Keep this release as"
            echo "a draft. If you find Aseprite useful, buy it at https://www.aseprite.org/."
            echo
            echo "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > notes.md

          gh release edit "$VERSION" -R "$GITHUB_REPOSITORY" --draft --notes-file notes.md
          cat notes.md
